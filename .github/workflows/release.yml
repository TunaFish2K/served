name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must use v<semver>, got: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "served") | .version')"
          if [[ -z "$package_version" || "$tag_version" != "$package_version" ]]; then
            echo "tag version $tag_version does not match Cargo version $package_version" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-

      - name: Install Linux release tools
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --user --break-system-packages ziglang==0.16.0
          if [[ ! -x "$CARGO_HOME/bin/cargo-zigbuild" ]] ||
             [[ "$("$CARGO_HOME/bin/cargo-zigbuild" --version 2>/dev/null)" != "cargo-zigbuild 0.23.0" ]]; then
            cargo install --locked --version 0.23.0 cargo-zigbuild
          fi

      - name: Run native checks
        run: make check

      - name: Validate system service template
        if: matrix.os == 'linux'
        run: make systemd-check

      - name: Validate launchd template
        run: make launchd-check

      - name: Check shell scripts
        if: matrix.os == 'linux'
        run: make shellcheck

      - name: Test online installer
        if: matrix.os == 'linux'
        run: make installer-check

      - name: Package release assets
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/package-release.sh "${{ matrix.arch }}"

      - name: Run packaged native binary
        shell: bash
        run: |
          "dist/served-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.metadata.outputs.tag }}-binary" --version

      - name: Smoke test macOS LaunchDaemon package
        if: matrix.os == 'macos'
        run: |
          tests/macos_install_smoke.sh \
            "dist/served-macos-${{ matrix.arch }}-${{ needs.metadata.outputs.tag }}-full.tar.gz"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Package deterministic source archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          scripts/package-source.sh "dist/served-v${RELEASE_VERSION}-source.tar.gz" "$RELEASE_VERSION"
          cd dist
          sha256sum "served-v${RELEASE_VERSION}-source.tar.gz" > "served-v${RELEASE_VERSION}-source.tar.gz.sha256"

      - name: Publish assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/* \
            --clobber
