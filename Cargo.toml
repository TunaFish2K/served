[package]
name = "served"
version = "0.14.1"
edition = "2024"
description = "A lightweight per-user service manager"
license = "Unlicense"
rust-version = "1.85"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:unicode-segmentation", "dep:unicode-width"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dotenvy = "0.15"
json5 = "=0.4.1"
futures-util = { version = "0.3", features = ["sink"] }
nix = { version = "0.29", features = ["signal", "process", "poll", "fs"] }
portable-pty = "0.9"
rand = "0.8"
ratatui = { version = "0.29", optional = true }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "=0.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
vt100 = "0.15.2"

[lints.rust]
unsafe_code = "forbid"
