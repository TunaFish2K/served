name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            os: linux
            cross_target: aarch64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            os: linux
            cross_target: x86_64-unknown-linux-gnu
          - name: macOS amd64
            runner: macos-15-intel
            os: macos
            cross_target: aarch64-apple-darwin
          - name: macOS arm64
            runner: macos-15
            os: macos
            cross_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.cross_target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-

      - name: Install Linux cross tools
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --user --break-system-packages ziglang==0.14.1
          if [[ ! -x "$CARGO_HOME/bin/cargo-zigbuild" ]] ||
             [[ "$("$CARGO_HOME/bin/cargo-zigbuild" --version 2>/dev/null)" != "cargo-zigbuild 0.21.8" ]]; then
            cargo install --locked --version 0.21.8 cargo-zigbuild
          fi

      - name: Run native checks
        run: make check

      - name: Validate system service template
        if: matrix.os == 'linux'
        run: make systemd-check

      - name: Check shell scripts
        if: matrix.os == 'linux'
        run: make shellcheck

      - name: Build native release binary
        run: make build-release

      - name: Run native release binary
        run: target/release/served --version

      - name: Cross-build other architecture
        run: make build-cross

      - name: Inspect cross-built binary
        shell: bash
        run: file "target/${{ matrix.cross_target }}/release/served"

  msrv:
    name: Rust 1.85 on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check all targets
        run: ./scripts/cargo-toolchain.sh 1.85.0 check --all-targets --locked

  nix:
    name: Nix ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build served
        run: nix build ".#packages.${{ matrix.system }}.served" --print-build-logs

      - name: Run multi-user NixOS test
        if: matrix.system == 'x86_64-linux'
        run: nix build .#checks.x86_64-linux.multi-user --print-build-logs

  aur:
    name: AUR split packages
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed namcap rustup

      - name: Create unprivileged package builder
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder rustup toolchain install stable --profile minimal

      - name: Build and inspect packages
        run: runuser -u builder -- env HOME=/home/builder scripts/check-aur-package.sh
