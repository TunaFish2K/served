[package]
name = "served"
version = "0.1.6"
edition = "2024"
description = "A lightweight service manager for one installation user"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["sink"] }
nix = { version = "0.29", features = ["signal", "process"] }
portable-pty = "0.9"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tui-textarea = "0.7"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
