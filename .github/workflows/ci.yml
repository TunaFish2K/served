name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Manuals and AI skill
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install --yes mandoc
      - run: make docs-check

  checks:
    name: Check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            cross_target: aarch64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            cross_target: x86_64-unknown-linux-gnu
          - name: macOS amd64
            runner: macos-15-intel
            os: macos
            arch: amd64
            cross_target: aarch64-apple-darwin
          - name: macOS arm64
            runner: macos-15
            os: macos
            arch: arm64
            cross_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.cross_target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-

      - name: Install Linux cross tools
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m pip install --user --break-system-packages ziglang==0.16.0
          if [[ ! -x "$CARGO_HOME/bin/cargo-zigbuild" ]] ||
             [[ "$("$CARGO_HOME/bin/cargo-zigbuild" --version 2>/dev/null)" != "cargo-zigbuild 0.23.0" ]]; then
            cargo install --force --locked --version 0.23.0 cargo-zigbuild
          fi

      - name: Run native checks
        run: make check

      - name: Run headless checks
        run: make check-headless

      - name: Validate system service template
        if: matrix.os == 'linux'
        run: make systemd-check

      - name: Validate launchd template
        run: make launchd-check

      - name: Check shell scripts
        if: matrix.os == 'linux'
        run: make shellcheck

      - name: Test online installer
        if: matrix.os == 'linux'
        run: make installer-check

      - name: Build native release binary
        run: make build-release

      - name: Run native release binary
        run: target/release/served --version

      - name: Cross-build other architecture
        run: |
          make build-cross
          scripts/build-targets.sh cross headless

      - name: Inspect cross-built binary
        shell: bash
        run: file "target/${{ matrix.cross_target }}/release/served"

      - name: Test Linux variant upgrades and rollback
        if: matrix.os == 'linux'
        shell: bash
        run: |
          scripts/package-release.sh "${{ matrix.arch }}"
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "served") | .version')"
          python3 tests/linux_variant_install.py \
            "dist/served-linux-${{ matrix.arch }}-v${version}-full.tar.gz" \
            "dist/served-linux-${{ matrix.arch }}-v${version}-headless-full.tar.gz"

      - name: Smoke test macOS LaunchDaemon package
        if: matrix.os == 'macos'
        shell: bash
        run: |
          scripts/package-release.sh "${{ matrix.arch }}"
          shopt -s nullglob
          archives=("dist/served-macos-${{ matrix.arch }}-v"*-full.tar.gz)
          [[ "${#archives[@]}" -eq 2 ]]
          tests/macos_install_smoke.sh "${archives[@]}"

  msrv:
    name: Rust 1.85 on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check all targets
        run: |
          ./scripts/cargo-toolchain.sh 1.85.0 check --all-targets --locked
          ./scripts/cargo-toolchain.sh 1.85.0 check --all-targets --locked --no-default-features
